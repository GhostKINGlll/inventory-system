<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码 - 进销存管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .auth-container h2 {
            text-align: center;
            color: #3498db;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .auth-container .form-group {
            margin-bottom: 20px;
        }
        .auth-container .btn {
            width: 100%;
            padding: 12px;
            font-size: 16px;
        }
        .auth-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }
        .auth-link a {
            color: #3498db;
            text-decoration: none;
        }
        .auth-link a:hover {
            text-decoration: underline;
        }
        .input-group {
            display: flex;
            gap: 8px;
        }
        .input-group input {
            flex: 1;
        }
        .input-group .btn {
            width: auto;
            white-space: nowrap;
            padding: 10px 16px;
            font-size: 14px;
        }
        @media (max-width: 480px) {
            .auth-container {
                margin: 40px 20px;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>忘记密码</h2>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <form th:action="@{/forgot-password}" method="post">
            <div class="form-group">
                <label>邮箱</label>
                <div class="input-group">
                    <input type="email" name="email" id="email" required placeholder="请输入注册邮箱">
                    <button type="button" class="btn btn-info" id="sendCodeBtn" onclick="sendCode()">获取验证码</button>
                </div>
            </div>
            <div class="form-group">
                <label>验证码</label>
                <input type="text" name="code" required placeholder="请输入验证码">
            </div>
            <div class="form-group">
                <label>新密码</label>
                <input type="password" name="password" required placeholder="请输入新密码">
            </div>
            <div class="form-group">
                <label>确认新密码</label>
                <input type="password" name="confirmPassword" required placeholder="请再次输入新密码">
            </div>
            <button type="submit" class="btn btn-primary">重置密码</button>
        </form>
        <div class="auth-link">
            想起了密码？<a th:href="@{/login}">返回登录</a>
        </div>
    </div>
    <script>
        let countdown = 0;
        function sendCode() {
            const email = document.getElementById('email').value;
            if (!email) { alert('请先输入邮箱'); return; }
            if (countdown > 0) return;
            const btn = document.getElementById('sendCodeBtn');
            btn.disabled = true;
            btn.textContent = '发送中...';
            fetch('/api/email/send-reset-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'email=' + encodeURIComponent(email)
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    countdown = 60;
                    btn.textContent = countdown + 's';
                    const timer = setInterval(() => {
                        countdown--;
                        if (countdown <= 0) {
                            clearInterval(timer);
                            btn.disabled = false;
                            btn.textContent = '获取验证码';
                        } else {
                            btn.textContent = countdown + 's';
                        }
                    }, 1000);
                } else {
                    alert(data.error || '发送失败');
                    btn.disabled = false;
                    btn.textContent = '获取验证码';
                }
            })
            .catch(() => {
                alert('网络错误');
                btn.disabled = false;
                btn.textContent = '获取验证码';
            });
        }
    </script>
</body>
</html>
