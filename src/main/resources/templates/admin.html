<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员面板 - 进销存管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>进销存管理系统</h1>
            <div style="margin: 8px 0; font-size: 14px; color: #666;">
                👤 <span th:text="${session.currentUser != null ? session.currentUser.username : '游客'}"></span>
                | <a th:href="@{/logout}" style="color:#e74c3c;">退出</a>
            </div>
            <div class="nav">
                <a th:href="@{/}">首页</a>
                <a th:href="@{/products}">商品管理</a>
                <a th:href="@{/purchases}">进货管理</a>
                <a th:href="@{/sales}">销售管理</a>
                <a th:href="@{/stock}">库存查询</a>
                <a th:href="@{/report}">数据报表</a>
                <a th:href="@{/ai/chat}">AI助手</a>
                <a th:href="@{/feedback}">用户反馈</a>
                <a th:href="@{/admin/users}" class="active">管理员面板</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h2>管理员面板 - VIP权限管理</h2>
            <p style="color: #666; margin-bottom: 20px;">管理所有注册用户的VIP权限，只有拥有VIP权限的用户才能登录系统。</p>

            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>用户名</th>
                        <th>角色</th>
                        <th>VIP状态</th>
                        <th>注册时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}"></td>
                        <td th:text="${user.username}"></td>
                        <td th:text="${user.role}"></td>
                        <td>
                            <span th:if="${user.vip}" style="color: #f39c12; font-weight: bold;">VIP</span>
                            <span th:unless="${user.vip}" style="color: #95a5a6; font-weight: bold;">无</span>
                        </td>
                        <td th:text="${user.createdAt}"></td>
                        <td>
                            <form th:action="@{/admin/users/toggle/{id}(id=${user.id})}" method="post" style="display:inline">
                                <button type="submit" th:classappend="${user.vip} ? 'btn btn-warning' : 'btn btn-success'">
                                    <span th:text="${user.vip} ? '撤销VIP' : '授予VIP'"></span>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
