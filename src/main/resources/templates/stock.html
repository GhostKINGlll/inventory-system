<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>库存查询</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>进销存管理系统</h1>
            <div style="margin: 8px 0; font-size: 14px; color: #666;">
                👤 <span th:text="${session.currentUser != null ? session.currentUser.username : '游客'}"></span>
                <span th:if="${session.currentUser != null && session.currentUser.role == 'ADMIN'}">
                    | <a th:href="@{/admin/users}" style="color:#3498db;">管理员面板</a>
                </span>
                | <a th:href="@{/logout}" style="color:#e74c3c;">退出</a>
            </div>
            <div class="nav">
                <a th:href="@{/}">首页</a>
                <a th:href="@{/products}">商品管理</a>
                <a th:href="@{/purchases}">进货管理</a>
                <a th:href="@{/sales}">销售管理</a>
                <a th:href="@{/stock}" class="active">库存查询</a>
                <a th:href="@{/report}">数据报表</a>
                <a th:href="@{/ai/chat}">AI助手</a>
                <a th:href="@{/feedback}">用户反馈</a>
                <a th:href="@{/admin/users}" th:if="${session.currentUser != null && session.currentUser.role == 'ADMIN'}">管理员面板</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h2>库存查询</h2>
            
            <div style="margin-bottom: 15px;">
                <a th:href="@{/stock}" class="btn btn-primary">刷新</a>
                <button id="lowStockBtn" class="btn btn-danger" onclick="showLowStock()">低库存预警</button>
                <button id="showAllBtn" class="btn btn-secondary" onclick="showAll()" style="display:none;">显示全部</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>商品名称</th>
                        <th>规格型号</th>
                        <th>单位</th>
                        <th>当前库存</th>
                        <th>最低库存</th>
                        <th>状态</th>
                    </tr>
                </thead>
                <tbody id="productTableBody">
                    <tr th:each="product : ${products}" th:data-low-stock="${product.totalStock <= product.minStock}">
                        <td th:text="${product.id}"></td>
                        <td th:text="${product.name}"></td>
                        <td th:text="${product.specification}"></td>
                        <td th:text="${product.unit}"></td>
                        <td th:text="${product.totalStock}"></td>
                        <td th:text="${product.minStock}"></td>
                        <td>
                            <span th:if="${product.totalStock <= product.minStock}" class="status-low">库存不足</span>
                            <span th:unless="${product.totalStock <= product.minStock}" class="status-normal">正常</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <style>
        .low-stock-row { background-color: #fff5f5 !important; }
        .low-stock-row td:first-child { border-left: 3px solid #e74c3c; }
    </style>
    <script>
        function showLowStock() {
            fetch('/stock/low-stock')
                .then(res => res.json())
                .then(data => {
                    const lowStockIds = new Set(data.map(p => p.id));
                    const rows = document.querySelectorAll('#productTableBody tr');
                    rows.forEach(row => {
                        const id = parseInt(row.cells[0].textContent);
                        if (lowStockIds.has(id)) {
                            row.style.display = '';
                            row.classList.add('low-stock-row');
                        } else {
                            row.style.display = 'none';
                        }
                    });
                    document.getElementById('lowStockBtn').style.display = 'none';
                    document.getElementById('showAllBtn').style.display = '';
                })
                .catch(err => alert('获取低库存数据失败'));
        }

        function showAll() {
            const rows = document.querySelectorAll('#productTableBody tr');
            rows.forEach(row => {
                row.style.display = '';
                row.classList.remove('low-stock-row');
            });
            document.getElementById('lowStockBtn').style.display = '';
            document.getElementById('showAllBtn').style.display = 'none';
        }
    </script>
</body>
</html>
