<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 进销存管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .auth-container h2 {
            text-align: center;
            color: #3498db;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .auth-container .form-group {
            margin-bottom: 20px;
        }
        .auth-container .btn {
            width: 100%;
            padding: 12px;
            font-size: 16px;
        }
        .auth-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }
        .auth-link a {
            color: #3498db;
            text-decoration: none;
        }
        .auth-link a:hover {
            text-decoration: underline;
        }
        @media (max-width: 480px) {
            .auth-container {
                margin: 40px 20px;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>用户注册</h2>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <form th:action="@{/register}" method="post">
            <div class="form-group">
                <label>邮箱</label>
                <div style="display: flex; gap: 8px;">
                    <input type="email" id="email" name="email" required placeholder="请输入邮箱" style="flex: 1;">
                    <button type="button" class="btn btn-primary" id="sendCodeBtn" onclick="sendCode()" style="white-space: nowrap; width: auto; padding: 8px 16px;">获取验证码</button>
                </div>
            </div>
            <div class="form-group">
                <label>邮箱验证码</label>
                <input type="text" name="code" required placeholder="请输入邮箱验证码">
            </div>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" required placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" required placeholder="请输入密码">
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" name="confirmPassword" required placeholder="请再次输入密码">
            </div>
            <button type="submit" class="btn btn-success">注 册</button>
        </form>
        <div class="auth-link">
            已有账号？<a th:href="@{/login}">立即登录</a>
        </div>
    </div>

    <script>
        var codeTimer = null;
        var codeCountdown = 0;
        function sendCode() {
            var btn = document.getElementById('sendCodeBtn');
            if (codeCountdown > 0) return;
            var email = document.getElementById('email').value;
            if (!email) { alert('请先输入邮箱'); return; }
            btn.disabled = true;
            btn.innerText = '发送中...';
            fetch('/api/email/send-code?email=' + encodeURIComponent(email), { method: 'POST' })
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.success) {
                        codeCountdown = 60;
                        btn.innerText = '60s';
                        codeTimer = setInterval(function() {
                            codeCountdown--;
                            if (codeCountdown <= 0) {
                                clearInterval(codeTimer);
                                btn.disabled = false;
                                btn.innerText = '获取验证码';
                            } else {
                                btn.innerText = codeCountdown + 's';
                            }
                        }, 1000);
                    } else {
                        alert(data.error || '发送失败');
                        btn.disabled = false;
                        btn.innerText = '获取验证码';
                    }
                })
                .catch(function() {
                    alert('网络错误');
                    btn.disabled = false;
                    btn.innerText = '获取验证码';
                });
        }
    </script>
</body>
</html>
